<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMBUSA | Examination Results Portal</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --primary-color: #0b2240; 
            --accent-color: #d4af37;  
            --secondary-color: #f4f6f9;
            --text-color: #212529;
            --border-color: #ced4da;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border-top: 5px solid var(--accent-color);
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 20px;
        }

        .header-section h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 26px;
            font-weight: 700;
        }

        .header-section h2 {
            color: #555;
            margin: 5px 0 0 0;
            font-size: 14px;
            text-transform: uppercase;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--secondary-color);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input[type="text"] {
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            display: none;
            padding: 10px;
            background-color: #f8d7da;
            border-radius: 6px;
        }

        .result-card {
            display: none;
            margin-top: 30px;
        }

        .student-profile {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .grade-cell {
            font-weight: 700;
            text-align: right;
        }

        .highlight-row {
            background-color: #fffbeb;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>KMBUSA</h1>
        <h2>Kilinochchi Maths Bio University Students' Association</h2>
    </div>
    
    <div class="search-box">
        <label style="font-weight:600">Enter Index Number or NIC:</label>
        <input type="text" id="studentInput" placeholder="e.g. BS/2026/001 or 2005...">
        <button onclick="searchResult()">View Results</button>
    </div>

    <div id="errorMessage" class="error">No record found. Please verify your Index / NIC.</div>

    <div id="resultCard" class="result-card">
        <div class="student-profile">
            <div id="resName" style="font-size:20px; font-weight:700;">Name</div>
            <div style="font-size:13px; color:#cbd5e1;">
                Index: <span id="resIndex"></span> | NIC: <span id="resNic"></span>
            </div>
        </div>
        
        <table>
            <tr><td>Physics</td><td id="resSub1" class="grade-cell"></td></tr>
            <tr><td>Chemistry</td><td id="resSub2" class="grade-cell"></td></tr>
            <tr><td>Biology</td><td id="resSub3" class="grade-cell"></td></tr>
            <tr class="highlight-row"><td>Z-Score</td><td id="resZscore" style="text-align:right"></td></tr>
            <tr class="highlight-row"><td>District Rank</td><td id="resRank" style="text-align:right"></td></tr>
        </table>
    </div>
</div>

<script>
    let resultsData = [];

    // Load data from the server/GitHub
    fetch('results.json')
        .then(response => response.json())
        .then(data => { resultsData = data; })
        .catch(err => console.error("Data load error:", err));

    function searchResult() {
        const query = document.getElementById('studentInput').value.trim().toLowerCase();
        const student = resultsData.find(s => 
            String(s.index).toLowerCase() === query || 
            String(s.nic).toLowerCase() === query
        );

        if (student) {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('resultCard').style.display = 'block';
            
            document.getElementById('resName').innerText = student.name;
            document.getElementById('resIndex').innerText = student.index;
            document.getElementById('resNic').innerText = student.nic;
            document.getElementById('resSub1').innerText = student.subject1;
            document.getElementById('resSub2').innerText = student.subject2;
            document.getElementById('resSub3').innerText = student.subject3;
            document.getElementById('resZscore').innerText = student.zscore;
            document.getElementById('resRank').innerText = student.district_rank;
        } else {
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
        }
    }
</script>
</body>
</html>
